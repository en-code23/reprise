[package]
name = "reprise-agent"
version = "1.9.1"
edition = "2024"
license = "MIT"
description = "Local managed-session runner for Reprise"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fs2 = "0.4"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustyline = "19.0.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }

[profile.release]
lto = "thin"
strip = true
