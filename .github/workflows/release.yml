name: Build macOS Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.0)"
        required: true
        default: "1.5.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app, ZIP, and DMG
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/build-release.sh

      - name: Test native workflows
        run: swift test --package-path macos

      - name: Sign update archive and feed
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/make-appcast.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Reprise v${{ steps.version.outputs.value }}
          generate_release_notes: true
          draft: true
          files: |
            dist/Reprise-${{ steps.version.outputs.value }}-macOS.dmg
            dist/Reprise-${{ steps.version.outputs.value }}-macOS.zip
            dist/appcast.xml

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release edit "v$VERSION" --draft=false --latest
