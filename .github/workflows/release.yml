name: Build macOS Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.0.0)"
        required: true
        default: "1.4.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Select version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build app, ZIP, and DMG
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/build-release.sh

      - name: Test native workflows
        run: swift test --package-path macos

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Reprise v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/Reprise-${{ steps.version.outputs.value }}-macOS.dmg
            dist/Reprise-${{ steps.version.outputs.value }}-macOS.zip
