name: Build Desktop Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (major.minor.patch)"
        required: true
        default: "1.6.0"
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Select version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then value="${GITHUB_REF_NAME#v}"; else value="$INPUT_VERSION"; fi
          [[ "$value" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "value=$value" >> "$GITHUB_OUTPUT"
  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build universal Mac app
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: ./scripts/build-release.sh
      - name: Test native Mac workflows
        run: swift test --package-path macos
      - name: Sign Mac update archive and feed
        env:
          VERSION: ${{ needs.version.outputs.value }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: ./scripts/make-appcast.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*-macOS.dmg
            dist/*-macOS.zip
            dist/appcast.xml
  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test Windows installer
        env:
          VERSION: ${{ needs.version.outputs.value }}
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version $env:VERSION -TestInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/windows/*Setup.exe
            dist/windows/*Portable.zip
            dist/windows/*full.nupkg
            dist/windows/releases.win.json
            dist/windows/RELEASES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-previews
          path: build/windows/qa/*
  publish:
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Upload complete desktop release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.value }}
          name: Reprise v${{ needs.version.outputs.value }}
          generate_release_notes: true
          draft: true
          files: release-assets/*
      - name: Publish both platforms together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.value }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
